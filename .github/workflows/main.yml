name: Crypto Telegram Monitor

on:
  schedule:
    # Jadwal berjalan otomatis setiap 4 jam (sesuaikan dengan kebutuhan)
    # Format cron UTC: menit jam hari bulan hari_dalam_minggu
    - cron: '0 */4 * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol "Run workflow" di GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Mempercepat eksekusi dengan caching dependency

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Monitor Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
