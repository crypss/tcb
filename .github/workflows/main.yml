name: Crypto Price Bot

on: # Atau gunakan cron untuk otomatisasi
  schedule:
    - cron: '*/10 * * * *' # Berjalan setiap 10 menit sekali
  workflow_dispatch: # Memungkinkan tombol Run manual di tab Actions GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx python-telegram-bot

      - name: Run Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: |
          python bot.py
