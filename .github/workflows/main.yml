name: Telegram Bot Runner

on:
  push:
    branches: [ main, master ]
  schedule:
    # Trigger setiap 4 jam (mencegah delay GitHub melebihi batas 6 jam)
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: telegram-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Batasi durasi maksimum 270 menit (4.5 jam) agar tidak kena hard kill 6 jam
    timeout-minutes: 270 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Telegram Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
      run: |
        python bot.py
